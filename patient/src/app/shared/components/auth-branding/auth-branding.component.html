<div class="left-side">
  <div class="left-content">
    @if (configError) {
      <img src="assets/images/logo.svg" alt="" class="logo-img" />
      <p class="brand-name">HCW@Home</p>
      <p class="error-text">{{ 'common.platformUnavailable' | translate }}</p>
    } @else {
      @if (siteLogoWhite) {
        <img [src]="siteLogoWhite" alt="" class="logo-img" />
      } @else {
        <img src="assets/images/logo.svg" alt="" class="logo-img" />
      }
      @if (loginText) {
        <div class="login-text" [innerHTML]="loginText"></div>
      }
    }
  </div>
</div>
