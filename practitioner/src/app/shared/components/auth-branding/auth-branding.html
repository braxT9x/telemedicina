<div class="left-side">
  <div class="left-content">
    @if (configError) {
      <img src="/images/logo.svg" alt="Logo" class="logo-img" />
      <h1>{{ brandName }}</h1>
      <p class="error-text">{{ 'common.platformUnavailable' | translate }}</p>
    } @else {
      @if (siteLogoWhite) {
        <img [src]="siteLogoWhite" alt="Logo" class="logo-img" />
      } @else {
        <img src="/images/logo.svg" alt="Logo" class="logo-img" />
      }
      @if (showBrandName) {
        <h1>{{ brandName }}</h1>
      }
      @if (loginText) {
        <div class="login-text" [innerHTML]="loginText"></div>
      }
    }
  </div>
</div>
